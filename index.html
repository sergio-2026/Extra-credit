<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retirement Chart (Extra Credit)</title>

  <!-- Simple CSS file -->
  <link rel="stylesheet" href="style.css">

  <!-- Chart.js library (new library I researched) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="light-mode">
  <h1>Retirement Saver</h1>

  <!-- Button to switch page between light and dark mode -->
  <button id="themeButton">Dark</button>

  <p>Fill in the boxes and see how your money can grow over time.</p>

  <form id="calcForm">
    <label>
      Current age:
      <input type="number" id="ageNow" value="30" min="18" max="80">
    </label>

    <label>
      Retirement age:
      <input type="number" id="ageRetire" value="65" min="20" max="90">
    </label>

    <label>
      Monthly save amount ($):
      <input type="number" id="monthlySave" value="500" min="0">
    </label>

    <label>
      Yearly interest rate (%):
      <input type="number" id="yearRate" value="7" min="0" max="30" step="0.1">
    </label>

    <button type="submit">Calculate</button>
  </form>

  <div id="summary">
    <p>Final balance: <span id="finalBalance">$0</span></p>
    <p>Estimated monthly income in retirement (4% rule): <span id="monthlyIncome">$0</span></p>
  </div>

  <!-- Chart.js will draw the line chart inside this canvas -->
  <canvas id="growthChart" width="400" height="220"></canvas>

  <!-- Chart.js will draw the bar chart inside this canvas -->
  <canvas id="breakdownChart" width="400" height="220"></canvas>


  <!-- Your JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
